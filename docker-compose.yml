services:
  postgres:
    image: postgres:16-alpine
    container_name: seguro-auto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seguro_auto_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seguro_auto_ai"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seguro-auto-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguro_auto_ai
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:3000}
      CHAT_RATE_LIMIT_WINDOW_MS: ${CHAT_RATE_LIMIT_WINDOW_MS:-60000}
      CHAT_RATE_LIMIT_MAX: ${CHAT_RATE_LIMIT_MAX:-30}
    volumes:
      - ./secrets/gemini_api_key.txt:/run/secrets/gemini_api_key:rw,z
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seguro-auto-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"


volumes:
  postgres_data:
