services:
  postgres:
    image: postgres:16-alpine
    container_name: seguro-auto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seguro_auto_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: seguro-auto-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/seguro_auto_ai
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
    secrets:
      - gemini_api_key
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: seguro-auto-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

secrets:
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt

volumes:
  postgres_data:
